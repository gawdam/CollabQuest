services:
  - type: web
    name: collabquest-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run dev:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://gawdam.github.io
      - key: QLOO_API_KEY
        sync: false
